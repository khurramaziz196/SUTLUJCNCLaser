<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheet calculator</title>
<link rel="icon" type="image/jpeg" href="sutluj-logo.jpg?v=gr-3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="styles.css?v=jobplan-1">
</head>
<body class="calc-page">
<header class="calc-top"><img src="sutluj-logo.jpg?v=gr-3" alt=""><div><b>Sheet calculator</b><span id="calc-sub"></span></div></header>
<main id="calc" class="calc-main"></main>
<div id="toast" role="status"></div>
<script type="module">
// Pop-out sheet calculator. Starts from what the app saved when "Pop out" was pressed; "Apply to quote"
// sends the items back to the app tab that opened it (same browser, over a BroadcastChannel).
import {mountCalculator} from './calculator.mjs?v=7';
let data = {};
try { data = JSON.parse(localStorage.getItem('gr-sheet-calc') || '{}'); } catch {}
const token = location.hash.slice(1), linked = !!(data.linked && data.token === token);
const channel = 'BroadcastChannel' in window ? new BroadcastChannel('gr-sheet-calc') : null;
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4500); };
document.getElementById('calc-sub').textContent = `${data.company ? ' · ' + data.company : ''} · ${linked ? 'linked to the open quote' : 'standalone'}`;
mountCalculator(document.getElementById('calc'), {...(data.init || {}), onApply: linked && channel ? s => { channel.postMessage({type: 'apply', token, state: s}); toast('Sent to the quote. Switch to the app window and save the quote.'); } : null});
</script>
</body>
</html>
